<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d1d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SnapPDF Lite"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>SnapPDF Lite</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7eeee;background:#101313}*{box-sizing:border-box}body{margin:0;padding-bottom:110px}button,input,select{font:inherit}button{cursor:pointer}header{height:138px;background:#202020;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px}.logo{font-weight:800;font-size:31px;letter-spacing:-1.5px}.logo b{color:#208e90}.mark{display:inline-block;font-size:38px;font-style:italic;color:#218c8d;transform:rotate(-15deg);vertical-align:-4px;margin-right:8px}main{max-width:740px;margin:auto;padding:20px 18px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:#1c8589;color:white;border:0;border-radius:15px;font-weight:650;padding:19px 7px;font-size:16px;min-height:65px}.outline{display:block;width:100%;background:transparent;border:1.5px solid #8e9b9b;border-radius:15px;margin:14px 0 38px;color:#209396;padding:17px;font-size:18px}.section-title{font-size:25px;font-weight:450;margin:28px 0 22px}.recent{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:105px}.recent .item{min-width:0;display:flex;gap:10px;align-items:center;background:#172020;border:0;border-radius:18px;color:#d8e0e0;text-align:left;padding:12px}.thumb{background:#eef1f0;color:#4e7778;width:44px;height:65px;border-radius:4px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.item-info{min-width:0}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.muted{font-size:12px;color:#9ca8a9;margin-top:6px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:15px}.tool{background:#172020;color:#e3e9e8;border:0;border-radius:15px;padding:22px 12px;min-height:79px;text-align:left;display:flex;align-items:center;gap:14px;font-size:15px}.tool .ico{color:#0d9ac3;font-size:23px;min-width:24px}.nav{position:fixed;bottom:0;left:0;right:0;height:94px;padding-bottom:env(safe-area-inset-bottom);background:#192222;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav button{background:transparent;border:0;color:#c4cccc;display:grid;gap:3px;place-items:center;font-size:13px;min-width:84px}.nav .active{color:white}.nav .ni{font-size:28px}.pane{display:none}.pane.active{display:block}.library-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#182222;border-radius:13px;padding:13px;margin:9px 0}.library-item button{color:#dce9e9;background:#237d80;border:none;padding:10px;border-radius:9px}.library-item .del{background:#543034}.small{font-size:13px;color:#a5b3b3}.panel{background:#182222;border-radius:16px;padding:20px;margin-top:20px;line-height:1.6}.panel label{display:block;margin:12px 0 5px}.panel input,.panel select{background:#101616;color:white;border:1px solid #577070;border-radius:10px;width:100%;padding:11px}.action{background:#168588;color:white;border:none;border-radius:10px;padding:12px 16px;margin:8px 5px 8px 0}.secondary{background:#324746}.danger{background:#763b40}.hidden{display:none!important}#toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:#365f60;color:white;padding:13px 18px;border-radius:12px;max-width:90vw;display:none;z-index:100;text-align:center}dialog{border:1px solid #4b7778;border-radius:18px;background:#171f1f;color:white;width:min(95vw,620px);max-height:86vh;padding:20px}dialog::backdrop{background:#000b}#previewCanvas{display:block;max-width:100%;margin:10px auto;background:white}#signature{background:white;width:100%;height:150px;touch-action:none;border-radius:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}#loading{position:fixed;inset:0;background:#080e0edc;z-index:200;display:none;place-items:center;color:white}a{color:#62c7c7}small{color:#a8b4b4}@media(min-width:600px){.tool{font-size:18px}.primary{font-size:19px}}
#scanner{position:fixed;inset:0;z-index:150;background:#070b0b;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.scan-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:white}.scan-stage{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;background:#000}#scanVideo{width:100%;height:100%;object-fit:contain}#scanOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#scanStatus{text-align:center;font-size:14px;color:#d1e5e2;padding:10px}.scan-meter{height:4px;background:#244444}.scan-meter>div{height:100%;width:0;background:#45e4ae;transition:width .13s}.scan-bottom{display:flex;justify-content:space-around;align-items:center;gap:8px;padding:12px 10px 18px}.scan-bottom button{border:0;background:#234e50;color:white;border-radius:12px;padding:12px 10px;font-size:14px}.scan-bottom .shutter{width:64px;height:64px;border-radius:50%;background:white;border:6px solid #24999c;flex-shrink:0}.scan-bottom .finish{background:#18898b}.scan-count{display:flex;align-items:center;gap:8px;font-size:13px}#scanThumb{width:34px;height:47px;object-fit:cover;border-radius:4px;background:white}@media(orientation:landscape){.scan-bottom{padding:6px}.scan-bottom .shutter{height:50px;width:50px}}
</style></head><body><header><div class="logo"><span class="mark">ϟ</span>snap<b>pdf</b> <span style="font-size:11px;font-weight:400;color:#8bcccc">Lite PWA</span></div></header><main><section id="home" class="pane active"><div class="hero"><button class="primary" id="imagesBtn">▧ Select Images</button><button class="primary" id="cameraBtn">▣ Open Camera</button></div><button class="outline" id="openBtn">▤ Open a PDF</button><div class="section-title">Recent PDFs</div><div id="recent" class="recent"></div><div class="section-title" style="margin-top:42px">PDF Tools</div><div class="tools"><button class="tool" data-tool="compress"><span class="ico">↘</span>Compress PDF</button><button class="tool" data-tool="protect"><span class="ico">♙</span>Protect PDF</button><button class="tool" data-tool="unlock"><span class="ico">♧</span>Unlock PDF</button><button class="tool" data-tool="sign"><span class="ico">✍</span>Sign PDF</button><button class="tool" data-tool="watermark"><span class="ico">◈</span>Watermark</button><button class="tool" data-tool="merge"><span class="ico">⇡</span>Merge PDF</button></div></section><section id="library" class="pane"><div class="section-title">My PDFs</div><div id="files"></div></section><section id="settings" class="pane"><div class="section-title">Settings</div><div class="panel"><b>SnapPDF Lite</b><p>文件預設保存在這台裝置的瀏覽器儲存空間；不會上傳至任何伺服器。你可以使用「下載」將 PDF 儲存至 iPhone 的「檔案」。</p><p>首次使用需有網路來載入 PDF 處理元件。部分瀏覽器清理網站資料時，也會刪除已儲存的文件。</p><button class="action danger" id="clearBtn">刪除所有本機文件</button><p><small>本作品為獨立示範專案，並非原 SnapPDF 官方產品。</small></p></div></section></main><nav class="nav"><button data-tab="home" class="active"><span class="ni">⌂</span>Home</button><button data-tab="library"><span class="ni">▱</span>My PDFs</button><button data-tab="settings"><span class="ni">⚙</span>Settings</button></nav><input id="imagesInput" type="file" accept="image/*" multiple hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="pdfInput" type="file" accept="application/pdf" hidden><input id="multiInput" type="file" accept="application/pdf" multiple hidden><div id="scanner" class="hidden" aria-label="A4 自動掃描相機"><div class="scan-head"><button id="scanClose" class="action secondary">✕ 返回</button><strong>A4 自動掃描</strong><span class="scan-count"><img id="scanThumb" hidden alt="最新掃描頁面"><span id="scanCount">已掃描 0 頁</span></span></div><div class="scan-stage"><video id="scanVideo" autoplay playsinline muted></video><canvas id="scanOverlay"></canvas></div><div id="scanStatus" role="status">請將 A4 紙張放入畫面</div><div class="scan-meter"><div id="scanProgress"></div></div><div class="scan-bottom"><button id="scanRearm">再次掃描</button><button class="shutter" id="scanShutter" aria-label="手動拍照"></button><button class="finish" id="scanDone">完成並製作 PDF</button></div></div><div id="toast" role="status"></div><div id="loading">正在處理 PDF…</div><dialog id="modal"><h3 id="modalTitle">PDF</h3><div id="modalBody"></div><div class="modal-actions"><button id="closeModal" class="action secondary">關閉</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module" src="app.js"></script></body></html>
